services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-sinay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sinay}
      POSTGRES_DB: ${DB_NAME:-sinay}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sinay}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-sinay}
      DB_PASSWORD: ${DB_PASSWORD:-sinay}
      DB_NAME: ${DB_NAME:-sinay}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8088:8088"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8088}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  db_data:
